# 把上游官方 release tag 编译成 iOS 安装包（ad-hoc 签名、不含描述文件），用 TrollStore（巨魔）安装。
# 手动运行：Actions → iOS IPA (TrollStore) → Run workflow；tag 留空时构建上游最新正式版。
# ipa 任务产出安装包 artifact；simulator-smoke 任务在 iPhone 模拟器里启动游戏并截图，它失败不影响 ipa。
# 默认用 Intel 编译机：GitHub 的 arm64 macOS 机器容量不足时，任务排队 15 分钟后会被取消。
name: iOS IPA (TrollStore)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 上游 tag，例如 v4.0.2；留空 = 最新正式版
        required: false
        default: ""
      runner:
        description: macOS 编译机（arm64 的 macos-26 / macos-15 经常排不上队）
        type: choice
        options: [macos-26-intel, macos-15-intel, macos-26, macos-15]
        default: macos-26-intel
  push:
    branches: [master]
    paths: [.github/workflows/ios-trollstore.yml]

permissions:
  contents: read

env:
  UPSTREAM: 00-Evan/shattered-pixel-dungeon

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building \`$UPSTREAM@$tag\`" >> "$GITHUB_STEP_SUMMARY"

  ipa:
    needs: resolve
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Clone upstream
        run: git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM.git" src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          java -version
      - name: Build IPA
        working-directory: src
        # iosSkipSigning：RoboVM 改用 ad-hoc 签名，不需要 Apple 开发者证书；TrollStore 安装时会自己补签
        run: ./gradlew --no-daemon --configure-on-demand --stacktrace :ios:createIPA -Probovm.iosSkipSigning=true
      - name: Inspect IPA
        run: |
          ipa=$(find src/ios/build -name '*.ipa' -print -quit)
          test -n "$ipa"
          mkdir -p out
          out="out/ShatteredPD-$TAG-iOS-TrollStore.ipa"
          cp "$ipa" "$out"
          unzip -q "$out" -d unpacked
          app=$(ls -d unpacked/Payload/*.app)
          plutil -p "$app/Info.plist"
          lipo -info "$app/$(plutil -extract CFBundleExecutable raw "$app/Info.plist")"
          codesign -dvv "$app"
          codesign -d --entitlements - "$app" || true
          ls -l "$out"
      # archive: false 直接上传 .ipa（不套 zip），手机浏览器里下载后可以直接分享给 TrollStore
      - uses: actions/upload-artifact@v7
        with:
          path: out/ShatteredPD-${{ needs.resolve.outputs.tag }}-iOS-TrollStore.ipa
          archive: false
          if-no-files-found: error

  simulator-smoke:
    needs: resolve
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 45
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Clone upstream
        run: git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM.git" src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Launch in iPhone simulator
        working-directory: src
        run: |
          log="$GITHUB_WORKSPACE/simulator.log"
          ./gradlew --no-daemon --configure-on-demand :ios:launchIPhoneSimulator > "$log" 2>&1 &
          gradle=$!
          # 模拟器里的 App 在宿主机上也是一个进程，进程名就是可执行文件名 IOSLauncher
          running() { pgrep -x IOSLauncher > /dev/null; }
          for i in $(seq 150); do  # 最多等 25 分钟（编译约 7 分钟）
            running && break
            kill -0 "$gradle" 2>/dev/null || break
            (( i % 6 == 0 )) && echo "[$((i / 6)) min] $(tail -n 1 "$log" | cut -c1-160)"
            sleep 10
          done
          if ! running; then echo "::error::app did not start"; tail -n 150 "$log"; exit 1; fi
          echo "app process started"
          xcrun simctl list devices booted
          sleep 60
          xcrun simctl io booted screenshot "$GITHUB_WORKSPACE/simulator.png"
          if ! running; then echo "::error::app exited within 60s of launch"; tail -n 150 "$log"; exit 1; fi
          echo "app still running 60s after launch"
          tail -n 40 "$log"
          kill "$gradle" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulator-smoke
          path: |
            simulator.png
            simulator.log
          if-no-files-found: ignore
